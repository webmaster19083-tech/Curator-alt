[package]
name = "curator"
version = "0.1.0"
edition = "2021"
description = "Self-hosted gallery-dl front-end. Organize, view, tag, and rate your collection."

[[bin]]
name = "curator"
path = "src/main.rs"

[dependencies]
# Web framework
axum           = { version = "0.7", features = ["macros"] }
axum-extra     = { version = "0.9", features = [] }
tower          = "0.4"
tower-http     = { version = "0.5", features = ["compression-gzip", "fs"] }
tokio          = { version = "1",   features = ["full"] }

# Database
rusqlite       = { version = "0.31", features = ["bundled"] }
r2d2           = "0.8"
r2d2_sqlite    = "0.24"

# Serialization
serde          = { version = "1",    features = ["derive"] }
serde_json     = "1"

# Image thumbnailing
image          = { version = "0.25", default-features = false, features = [
                   "jpeg", "png", "gif", "webp", "bmp", "tiff", "avif-native"] }

# ZIP / .chpack building
zip            = { version = "2", default-features = false, features = ["deflate"] }
tempfile       = "3"

# CLI
clap           = { version = "4",    features = ["derive"] }

# Logging / tracing
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender     = "0.2"

# Utilities
anyhow         = "1"
chrono         = { version = "0.4",  features = ["serde"] }
dunce          = "1"
rand           = "0.8"
dirs           = "5"
sha1           = "0.10"
hex            = "0.4"
regex          = "1"
once_cell      = "1"
futures        = "0.3"
async-stream   = "0.3"
urlencoding    = "2"
walkdir        = "2"
tokio-util     = { version = "0.7", features = ["io"] }

# Platform kill (non-Windows)
[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
